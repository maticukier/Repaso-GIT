<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1430" />
    <title>Blobalanche</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1b1430;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      /*
       * Safe areas: en la app, Capacitor (SystemBars) inyecta --safe-area-inset-*;
       * en el navegador se usa env(). El juego nunca queda bajo un notch o la
       * barra de navegación.
       */
      :root {
        --sat: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
        --sar: var(--safe-area-inset-right, env(safe-area-inset-right, 0px));
        --sab: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
        --sal: var(--safe-area-inset-left, env(safe-area-inset-left, 0px));
      }
      #game {
        position: fixed;
        top: var(--sat);
        right: var(--sar);
        bottom: var(--sab);
        left: var(--sal);
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
